# Downstream depth on MVSEC LiDAR frames
data:
  # Spiking_RL ships no data. All paths below are relative to `root` — point
  # it at the directory that CONTAINS your mvsec/ folder.
  root: /home/psoni/Prasham_DR
  # (events *_data.hdf5, depth *_gt.hdf5) pairs
  pairs:
    - [mvsec/hdf5-20260528T222152Z-3-010/hdf5/indoor_flying/indoor_flying1_data.hdf5, mvsec/indoor_flying1_gt-013.hdf5]
    - [mvsec/indoor_flying2_data-002.hdf5, mvsec/indoor_flying2_gt-003.hdf5]
    - [mvsec/indoor_flying3_data-009.hdf5, mvsec/indoor_flying3_gt-012.hdf5]
    - [mvsec/outdoor_day1_data-008.hdf5, mvsec/outdoor_day1_gt-007.hdf5]
    - [mvsec/outdoor_night1_data-004.hdf5, mvsec/outdoor_night1_gt-011.hdf5]
  camera_side: left
  H: 260
  W: 346
  bin_ms: 5            # must match the pretraining bin size
  T_in: 20             # 100 ms context before each depth frame
  max_depth: 80.0      # mask LiDAR beyond this; for indoor-only runs use ~10
  min_depth: 0.1
  train_frac: 0.8
  val_frac: 0.2
  test_frac: 0.0

# Encoder settings must match the pretraining checkpoint's architecture
model:
  stage_channels: [32, 64, 96, 128]
  fused_channels: 64
  decay_init: 0.9
  threshold: 1.0
  count_clip: 4.0
  depth_min: 0.5
  depth_max: 80.0      # for indoor-only runs shrink this — don't waste sigmoid range

training:
  epochs: 30
  batch_size: 8
  lr: 0.001
  finetune_lr: 0.0001  # encoder lr with --finetune (head still uses lr)
  lr_end_factor: 0.1
  weight_decay: 1.0e-4
  silog_lambda: 0.5
  device: cuda
  num_workers: 4
  checkpoint_dir: checkpoints/depth
  log_interval: 50
  seed: 403
